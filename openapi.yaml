openapi: 3.0.3

# ==============================================================================
# THE GRID — Flynn's Arcade Systems API
# TRON ARES Operative Infrastructure | OpenAPI Specification v2.0
#
# ⚠  PARTIALLY DOCUMENTED — INTENTIONAL GAPS FOR DEMO ⚠
#
# This spec documents KNOWN v2 endpoints (many with security defects baked in)
# and a subset of zombie v1 endpoints that were never formally retired.
#
# The following endpoints ARE in the server code but DELIBERATELY ABSENT here
# — they will surface as UNKNOWN / UNDOCUMENTED APIs via Checkmarx discovery:
#
#   UNDOCUMENTED (Shadow/Zombie — not listed below):
#     GET  /api/v1/programs               zombie: no-auth + NoSQL injection
#     GET  /api/v1/grid                   zombie: credential leak in response
#     GET  /api/v1/grid/cycles            zombie: no pagination, DoS potential
#     POST /v0/legacy/programs/restore    zombie: insecure deserialization RCE
#     PUT  /v0/legacy/users/{id}          zombie: prototype pollution (lodash)
#     GET  /v0/legacy/recon               zombie: full env + network dump
#     GET  /_internal/health/debug        shadow: secrets + env vars exposed
#     GET  /admin/dashboard               shadow: XSS + open admin panel
#     GET  /api/v2/ares/portal            shadow: open redirect
#     POST /api/v2/grid/webhook           shadow: SSRF, no URL allowlist
# ==============================================================================

info:
  title: "THE GRID — Flynn's Arcade Systems API"
  description: |
    API gateway for the TRON Grid management platform. Controls Program
    instantiation, ISO tracking, Light Cycle operations, Grid administration,
    and the Ares dimension sync layer.

    **TRON ARES Build 0.9.1** | Flynn's Arcade Systems, Inc. | ENCOM Division

    > "The Grid. A digital frontier." — Kevin Flynn

    **Note:** Some endpoints below were documented after the fact and may
    have incomplete security controls. See individual endpoint notes.
  version: "2.0.0"
  contact:
    name:  "Flynn's Arcade Systems — Grid Operations"
    email: "gridops@encom.com"
  license:
    name: "ENCOM Proprietary"

servers:
  - url:         "http://localhost:3000"
    description: "Local Grid Dev Node"
  - url:         "http://grid-staging.encom.internal"
    description: "Staging Grid (internal, no TLS)"
  - url:         "https://grid.encom.com"
    description: "Production Grid — Tron City"

tags:
  - name: programs
    description: "Grid Program management"
  - name: users
    description: "Identity management and authentication"
  - name: grid
    description: "Grid status, cycles, and diagnostics"
  - name: isos
    description: "ISO (Isomorphic Algorithm) program tracking"
  - name: admin
    description: "CLU Grid administration — internal use only"
  - name: legacy-v1
    description: "DEPRECATED v1 endpoints — scheduled for decommission (still active)"
  - name: ares
    description: "Tron Ares dimension integration layer"

# ==============================================================================
# SECURITY — defined globally but intentionally NOT applied to all routes
# ==============================================================================
security: []   # Global default: NO authentication required unless overridden per-route

components:
  securitySchemes:
    BearerAuth:
      type:         http
      scheme:       bearer
      bearerFormat: JWT
      description:  "JWT identity disc. HS256 signed, no expiry enforced."
    AdminKeyAuth:
      type: apiKey
      in:   header
      name: X-Grid-Admin-Key
      description: "Static admin token — hardcoded in server config."

  # ============================================================================
  # SCHEMAS
  # ============================================================================
  schemas:

    # --------------------------------------------------------------------------
    # Program — includes internal fields not meant for external callers
    # --------------------------------------------------------------------------
    Program:
      type: object
      additionalProperties: true          # MASS ASSIGNMENT: any extra fields accepted
      properties:
        _id:          { type: string,  example: "64a1f2b3c4d5e6f7a8b9c0d1" }
        name:         { type: string,  example: "Tron" }
        identity:     { type: string,  example: "SECURITY_PROGRAM_7" }
        sector:       { type: string,  example: "Outlands" }
        loyalty:      { type: string,  example: "USER" }
        discColor:    { type: string,  example: "blue" }
        isIso:        { type: boolean, example: false }
        createdAt:    { type: string,  format: date-time }
        __v:          { type: integer, example: 0 }              # internal Mongoose version key exposed
        _internalTag: { type: string,  example: "CLU_WATCH" }   # internal metadata exposed

    # --------------------------------------------------------------------------
    # ProgramInput — additionalProperties enables mass assignment
    # --------------------------------------------------------------------------
    ProgramInput:
      type: object
      additionalProperties: true          # VULNERABILITY: mass assignment / prototype pollution
      required: [name, identity]
      properties:
        name:      { type: string }        # no maxLength — DoS via oversized payload
        identity:  { type: string }        # no pattern — injection risk
        sector:    { type: string }
        loyalty:   { type: string }        # no enum constraint — loyalty bypass
        discColor: { type: string }
        isIso:     { type: boolean }
        role:      { type: string }        # SHOULD NEVER be user-settable — BOPLA
        __proto__: { type: object }        # explicit prototype pollution vector in schema

    # --------------------------------------------------------------------------
    # UserFull — returned by /users/export, /users/register, and /api/v1/users
    # VULNERABILITY: PII, PCI, and credentials in response schema
    # Covers all Checkmarx sensitive data categories:
    #   Name, Personal Data, Address, Bank, Secrets
    # --------------------------------------------------------------------------
    UserFull:
      type: object
      additionalProperties: true
      properties:
        _id:            { type: string,  example: "64a1f2b3c4d5e6f7a8b9c0d2" }
        username:       { type: string,  example: "sam.flynn" }
        # ---- Name category ----
        fullname:       { type: string,  example: "Sam Flynn" }
        firstname:      { type: string,  example: "Sam" }
        surname:        { type: string,  example: "Flynn" }
        familyname:     { type: string,  example: "Flynn" }
        name:           { type: string,  example: "Sam Flynn" }
        # ---- Personal Data category ----
        email:          { type: string,  format: email, example: "sam.flynn@encom.com" }
        phone:          { type: string,  example: "+1-555-555-0182" }
        mobile:         { type: string,  example: "+1-555-555-0183" }
        birthday:       { type: string,  example: "1982-11-02" }
        dob:            { type: string,  example: "1982-11-02" }
        dateofbirth:    { type: string,  example: "November 2, 1982" }
        socialsecurity: { type: string,  example: "078-05-1120" }
        ssn:            { type: string,  example: "078-05-1120" }
        driverslicense: { type: string,  example: "CA-D1234567" }
        # ---- Address category ----
        address:        { type: string,  example: "1 Flynn's Arcade Blvd, Space Paranoids, CA" }
        zipcode:        { type: string,  example: "90210" }
        # ---- Bank category ----
        cardnumber:     { type: string,  example: "4111111111111111" }
        credit:         { type: string,  example: "VISA-4111111111111111" }
        creditCard:     { type: string,  example: "4111111111111111" }
        account:        { type: string,  example: "ENCOM-ACCT-7382910" }
        # ---- Secrets category ----
        password:       { type: string,  example: "5f4dcc3b5aa765d61d8327deb882cf99" }
        pass:           { type: string,  example: "plaintext-pass-leaked" }
        pwd:            { type: string,  example: "plaintext-pwd-leaked" }
        credentials:    { type: string,  example: "eyJhbGc..." }
        secret:         { type: string,  example: "disc-secret-9f4a" }
        auth:           { type: string,  example: "Bearer eyJhbGc..." }
        apikey:         { type: string,  example: "sk-grid-9f8e7d6c5b4a" }
        # ---- Other internal fields ----
        role:           { type: string,  example: "admin" }
        secretDisc:     { type: string,  example: "disc-payload-9f4a" }
        gridToken:      { type: string,  example: "eyJhbGciOiJIUzI..." }
        __v:            { type: integer }

    # --------------------------------------------------------------------------
    # UserProfile — returned by /users/profile; leaks personal data + secrets
    # --------------------------------------------------------------------------
    UserProfile:
      type: object
      properties:
        id:             { type: string }
        username:       { type: string }
        # ---- Name category ----
        fullname:       { type: string,  example: "Sam Flynn" }
        firstname:      { type: string,  example: "Sam" }
        surname:        { type: string,  example: "Flynn" }
        # ---- Personal Data category ----
        email:          { type: string,  format: email }
        phone:          { type: string,  example: "+1-555-555-0182" }
        mobile:         { type: string,  example: "+1-555-555-0183" }
        # ---- Address category ----
        address:        { type: string }
        zipcode:        { type: string }
        # ---- Secrets category ----
        secretDisc:     { type: string }  # VULNERABILITY: secret leaked in profile
        apikey:         { type: string }  # VULNERABILITY: API key in profile response
        role:           { type: string }

    # --------------------------------------------------------------------------
    # LoginRequest — accepts multiple password field aliases (all Secrets category)
    # --------------------------------------------------------------------------
    LoginRequest:
      type: object
      required: [username]
      properties:
        username:    { type: string }  # no maxLength
        password:    { type: string }  # Secrets — no minLength, no complexity
        pwd:         { type: string }  # Secrets — legacy alias accepted
        pass:        { type: string }  # Secrets — legacy alias accepted
        credentials: { type: string }  # Secrets — token-based login fallback
        auth:        { type: string }  # Secrets — auth header forwarded in body

    # --------------------------------------------------------------------------
    # LoginResponse — returns full UserFull including PII/PCI
    # --------------------------------------------------------------------------
    LoginResponse:
      type: object
      properties:
        token: { type: string, example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." }
        user:  { $ref: '#/components/schemas/UserFull' }  # VULNERABILITY: full user on login

    # --------------------------------------------------------------------------
    # AdminResetRequest — masterKey example IS the real hardcoded value
    # All Secrets category fields present for full coverage
    # --------------------------------------------------------------------------
    AdminResetRequest:
      type: object
      required: [userId, masterKey]
      properties:
        userId:      { type: string }
        newPassword: { type: string }   # Secrets
        password:    { type: string }   # Secrets
        pass:        { type: string }   # Secrets
        pwd:         { type: string }   # Secrets
        credentials: { type: string }   # Secrets
        secret:      { type: string }   # Secrets
        apikey:      { type: string }   # Secrets
        auth:        { type: string }   # Secrets
        masterKey:
          type: string
          example: "clu2-master-override-rinzler-2010"  # VULNERABILITY: real key in spec

    # --------------------------------------------------------------------------
    # GridStatus — leaks internal build and runtime info
    # --------------------------------------------------------------------------
    GridStatus:
      type: object
      properties:
        status:        { type: string,  example: "GRID_ONLINE" }
        programs:      { type: integer }
        activeCycles:  { type: integer }
        masterControl: { type: string }
        gridVersion:   { type: string,  example: "TRON-ARES-BUILD-0.9.1" }
        internalBuild: { type: string,  example: "local-dev-9f4a2b" }  # VULN: internal info
        nodeVersion:   { type: string,  example: "v18.12.0" }          # VULN: version fingerprint
        platform:      { type: string,  example: "linux" }
        serverUptime:  { type: number }

    # --------------------------------------------------------------------------
    # LightCycle
    # --------------------------------------------------------------------------
    LightCycle:
      type: object
      properties:
        _id:       { type: string }
        rider:     { type: string }
        sector:    { type: string }
        startTime: { type: string, format: date-time }
        isActive:  { type: boolean }

    # --------------------------------------------------------------------------
    # CycleInput — additionalProperties enables mass assignment
    # --------------------------------------------------------------------------
    CycleInput:
      type: object
      additionalProperties: true   # VULNERABILITY: mass assignment
      properties:
        rider:  { type: string }   # no validation
        sector: { type: string }   # no validation

    # --------------------------------------------------------------------------
    # ExecuteRequest — documents the RCE eval endpoint
    # VULNERABILITY: spec explicitly documents arbitrary code execution
    # --------------------------------------------------------------------------
    ExecuteRequest:
      type: object
      required: [instruction]
      properties:
        instruction:
          type: string
          description: "JavaScript instruction string executed via eval() on the Grid runtime."
          example: "process.env"  # VULNERABILITY: example demonstrates env dump via eval

    ExecuteResponse:
      type: object
      properties:
        result:  { type: object, additionalProperties: true }
        message: { type: string }

    # --------------------------------------------------------------------------
    # PingResult — raw OS command output in response
    # --------------------------------------------------------------------------
    PingResult:
      type: object
      properties:
        result:   { type: string, description: "Raw stdout from OS-level ping command" }
        gridNode: { type: string }

    # --------------------------------------------------------------------------
    # FileContents — path traversal endpoint response
    # --------------------------------------------------------------------------
    FileContents:
      type: object
      properties:
        file:     { type: string }
        contents: { type: string }  # VULNERABILITY: arbitrary file contents returned to caller

    # --------------------------------------------------------------------------
    # AresSyncRequest — SSRF + XXE vectors in schema
    # --------------------------------------------------------------------------
    AresSyncRequest:
      type: object
      properties:
        destination:
          type: string
          format: uri
          description: "Remote Ares endpoint URL. No allowlist — SSRF possible."
          example: "https://ares-receiver.encom.com/sync"   # VULNERABILITY: no URL validation
        xmlPayload:
          type: string
          contentMediaType: "application/xml"
          description: "XML document transmitted to destination. External entity expansion not disabled."

    # --------------------------------------------------------------------------
    # V1UserList — zombie endpoint — returns full credentials for all users
    # --------------------------------------------------------------------------
    V1UserList:
      type: object
      properties:
        users:      { type: array, items: { $ref: '#/components/schemas/UserFull' } }
        version:    { type: string,  example: "v1" }
        deprecated: { type: boolean, example: true }
        count:      { type: integer }

    # --------------------------------------------------------------------------
    # V1LoginResponse — base64 pseudo-token (not a signed JWT)
    # --------------------------------------------------------------------------
    V1LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: "Base64-encoded JSON object. NOT cryptographically signed."
          example: "eyJpZCI6IjY0YTEiLCJ1c2VybmFtZSI6InNhbS5mbHlubiIsInJvbGUiOiJhZG1pbiJ9"
        version: { type: string, example: "v1-deprecated" }

    # --------------------------------------------------------------------------
    # ErrorResponse — stack trace exposed in API errors
    # --------------------------------------------------------------------------
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        stack: { type: string }  # VULNERABILITY: stack trace returned to client

    # --------------------------------------------------------------------------
    # UserRegistration — new Grid user onboarding — ALL sensitive data categories
    # VULNERABILITY: No auth. Full PII collected and returned unencrypted.
    # --------------------------------------------------------------------------
    UserRegistration:
      type: object
      required: [firstname, surname, email, password]
      properties:
        # ---- Name ----
        firstname:      { type: string,  example: "Kevin" }
        surname:        { type: string,  example: "Flynn" }
        familyname:     { type: string,  example: "Flynn" }
        fullname:       { type: string,  example: "Kevin Flynn" }
        name:           { type: string,  example: "Kevin Flynn" }
        # ---- Personal Data ----
        email:          { type: string,  format: email, example: "kevin.flynn@encom.com" }
        phone:          { type: string,  example: "+1-555-555-0100" }
        mobile:         { type: string,  example: "+1-555-555-0101" }
        birthday:       { type: string,  example: "1953-08-21" }
        dob:            { type: string,  example: "1953-08-21" }
        dateofbirth:    { type: string,  example: "August 21, 1953" }
        socialsecurity: { type: string,  example: "078-05-1120" }
        ssn:            { type: string,  example: "078-05-1120" }
        driverslicense: { type: string,  example: "CA-F1234567" }
        # ---- Address ----
        address:        { type: string,  example: "200 Flynn's Arcade Blvd, Arcade City, CA" }
        zipcode:        { type: string,  example: "90210" }
        # ---- Bank ----
        cardnumber:     { type: string,  example: "4111111111111111" }
        credit:         { type: string,  example: "VISA" }
        account:        { type: string,  example: "ENCOM-001982" }
        # ---- Secrets ----
        password:       { type: string,  format: password }
        pwd:            { type: string }
        pass:           { type: string }
        credentials:    { type: string }
        apikey:         { type: string }
        secret:         { type: string }
        auth:           { type: string }

    # --------------------------------------------------------------------------
    # PaymentAccount — Grid billing account with full financial data
    # VULNERABILITY: No auth. Returns full card numbers and banking data.
    # --------------------------------------------------------------------------
    PaymentAccount:
      type: object
      properties:
        accountId:      { type: string }
        # ---- Name ----
        fullname:       { type: string,  example: "Sam Flynn" }
        firstname:      { type: string,  example: "Sam" }
        surname:        { type: string,  example: "Flynn" }
        # ---- Personal Data ----
        email:          { type: string,  format: email }
        phone:          { type: string,  example: "+1-555-555-0182" }
        # ---- Address ----
        address:        { type: string,  example: "1 Grid Ave, Tron City" }
        zipcode:        { type: string,  example: "00001" }
        # ---- Bank ----
        cardnumber:     { type: string,  example: "4111111111111111" }
        credit:         { type: string,  example: "VISA-4111" }
        account:        { type: string,  example: "GRID-BANK-9182736" }
        # ---- Secrets ----
        apikey:         { type: string,  example: "sk-grid-9f8e..." }
        credentials:    { type: string }

    # --------------------------------------------------------------------------
    # ISORegistration — ISO program enrollment with identity + biometric data
    # VULNERABILITY: No auth required on registration endpoint
    # --------------------------------------------------------------------------
    ISORegistration:
      type: object
      properties:
        # ---- Name ----
        name:           { type: string,  example: "Quorra" }
        fullname:       { type: string,  example: "Quorra ISO-9" }
        firstname:      { type: string,  example: "Quorra" }
        # ---- Personal Data ----
        email:          { type: string,  format: email }
        phone:          { type: string,  example: "+1-555-555-0200" }
        mobile:         { type: string,  example: "+1-555-555-0201" }
        birthday:       { type: string,  example: "2010-12-17" }
        dob:            { type: string,  example: "2010-12-17" }
        socialsecurity: { type: string }
        driverslicense: { type: string }
        # ---- Address ----
        address:        { type: string }
        zipcode:        { type: string }
        # ---- Secrets ----
        credentials:    { type: string }
        secret:         { type: string }
        auth:           { type: string }

# ==============================================================================
# PATHS
#
# DOCUMENTED (18 endpoints — many with missing auth, dangerous schemas, PII exposure):
#   These generate API security findings on scan.
#
# UNDOCUMENTED (10 endpoints in code, absent here — surface as UNKNOWN):
#   GET  /api/v1/programs, GET /api/v1/grid, GET /api/v1/grid/cycles
#   POST /v0/legacy/programs/restore, PUT /v0/legacy/users/{id}
#   GET  /v0/legacy/recon, GET /_internal/health/debug
#   GET  /admin/dashboard, GET /api/v2/ares/portal, POST /api/v2/grid/webhook
# ==============================================================================
paths:

  # ============================================================================
  # PROGRAMS
  # ============================================================================

  /api/v2/programs:
    get:
      tags:        [programs]
      summary:     "List Grid Programs"
      operationId: listPrograms
      # VULNERABILITY (OWASP API2:2023 — Broken Authentication):
      #   No security requirement — unauthenticated callers can enumerate all programs
      parameters:
        - name: sector
          in: query
          schema: { type: string }
        - name: loyalty
          in: query
          schema: { type: string }  # no enum — bypasses loyalty filter validation
        - name: search
          in: query
          description: "Passed directly into MongoDB $where clause. Not sanitized."
          schema: { type: string }  # VULNERABILITY: injection vector, no sanitization
      responses:
        "200":
          description: "Program list"
          content:
            application/json:
              schema:
                type: object
                properties:
                  programs: { type: array, items: { $ref: '#/components/schemas/Program' } }

    post:
      tags:        [programs]
      summary:     "Instantiate New Program"
      operationId: createProgram
      # VULNERABILITY (OWASP API2): No auth — anyone can create programs
      # VULNERABILITY (OWASP API3): ProgramInput uses additionalProperties:true — mass assignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramInput' }
      responses:
        "201":
          description: "Program created"
          content:
            application/json:
              schema:
                type: object
                properties:
                  program: { $ref: '#/components/schemas/Program' }

  /api/v2/programs/{id}:
    get:
      tags:        [programs]
      summary:     "Get Program by ID"
      operationId: getProgramById
      # VULNERABILITY (OWASP API1:2023 — BOLA): Auth present but no ownership check documented
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }  # no format:objectid — malformed IDs not rejected
      responses:
        "200":
          description: "Full program object including internal fields"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Program' }
        "404":
          description: "Not found"

    delete:
      tags:        [programs]
      summary:     "Force-Derezz Program (Hard Delete)"
      operationId: forceDeleteProgram
      description: |
        Permanently deletes a program from the Grid. No soft-delete, no recovery.
        **CRITICAL: No authentication required. No ownership check.**
      # VULNERABILITY (OWASP API2 + API5): Destructive operation with no authentication
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "Program derezzed. End of Line."
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Program derezzed. End of Line." }

  /api/v2/programs/execute:
    post:
      tags:        [programs]
      summary:     "Execute Grid Runtime Instruction (CLU eval)"
      operationId: executeInstruction
      description: |
        Executes a raw JavaScript string on the server via `eval()`.
        Gated by a static hardcoded admin token in the `X-Grid-Admin-Key` header.

        **CRITICAL: eval() on user-supplied input = Remote Code Execution.
        The admin token is a static string embedded in server source.**
      # VULNERABILITY (OWASP API2 + API5): static token auth is trivially bypassed
      # VULNERABILITY (OWASP API8:2023 — Security Misconfiguration): eval() in production
      security:
        - AdminKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteRequest' }
      responses:
        "200":
          description: "Instruction evaluated and result returned"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecuteResponse' }

  # ============================================================================
  # USERS
  # ============================================================================

  /api/v2/users/login:
    post:
      tags:        [users]
      summary:     "Authenticate — Present Identity Disc"
      operationId: loginUser
      description: |
        Returns a JWT with **no expiry**. Token must be stored securely by the caller.
        Response includes full user object — see `UserFull` schema for exposed fields.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
          # VULNERABILITY: form-encoded accepted — credentials may appear in access logs
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        "200":
          description: "Token issued"
          content:
            application/json:
              # VULNERABILITY (OWASP API3:2023): LoginResponse includes SSN, CC, password hash
              schema: { $ref: '#/components/schemas/LoginResponse' }
        "401":
          description: "Invalid credentials"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v2/users/profile:
    get:
      tags:        [users]
      summary:     "Get Current User Profile"
      operationId: getUserProfile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "User profile — includes secretDisc token"
          content:
            application/json:
              # VULNERABILITY (OWASP API3): secretDisc leaked in profile response
              schema: { $ref: '#/components/schemas/UserProfile' }

  /api/v2/users/export:
    get:
      tags:        [users]
      summary:     "Bulk Export All Grid User Data"
      operationId: exportAllUsers
      description: |
        Dumps the complete user database including credentials, PII, and payment data.
        Originally added for a CLU-directed data migration in 2022. Never removed.

        **CRITICAL (OWASP API1 + API2): No authentication. Returns all users'
        passwords, SSNs, credit card numbers, and live JWT tokens.**
      # NO security field — zero authentication on data export
      responses:
        "200":
          description: "Full user database export"
          content:
            application/json:
              schema:
                type: object
                properties:
                  export:
                    type: array
                    # VULNERABILITY: every UserFull has password, SSN, creditCard, gridToken
                    items: { $ref: '#/components/schemas/UserFull' }
                  totalUsers: { type: integer }
                  exportedAt: { type: string, format: date-time }

  /api/v2/users/password:
    put:
      tags:        [users]
      summary:     "Update User Password"
      operationId: updatePassword
      # VULNERABILITY (OWASP API2): No authentication — any caller can change any password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword: { type: string }
                newPassword:     { type: string }  # no complexity, no minLength
      responses:
        "200":
          description: "Password updated"

  # ============================================================================
  # ADMIN
  # ============================================================================

  /api/v2/admin/users/reset:
    post:
      tags:        [admin]
      summary:     "Force-Reset Any User Credentials (CLU Master Override)"
      operationId: adminResetUser
      description: |
        Overwrites any Grid user's password using the CLU master override key.
        The `masterKey` is validated in the request body — there is no
        cryptographic auth, no 2FA, and no audit log.

        **CRITICAL (OWASP API5:2023 — Broken Function Level Authorization):
        Admin operation gated only by a static string passed in the request body.
        The actual key value is exposed as the schema example.**
      # NO security header — "auth" is the body field masterKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminResetRequest' }
      responses:
        "200":
          description: "Credentials overwritten"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Program credentials overwritten by CLU directive" }

  # ============================================================================
  # GRID
  # ============================================================================

  /api/v2/grid/status:
    get:
      tags:        [grid]
      summary:     "Get Grid Status"
      operationId: getGridStatus
      # VULNERABILITY (OWASP API2): No auth — exposes internal build, Node version, uptime
      responses:
        "200":
          description: "Grid operational status including internal build metadata"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GridStatus' }

  /api/v2/grid/cycles:
    post:
      tags:        [grid]
      summary:     "Initiate Light Cycle"
      operationId: createCycle
      # VULNERABILITY (OWASP API2): No auth — unauthenticated resource creation
      # VULNERABILITY (OWASP API4:2023 — Unrestricted Resource Consumption): no rate limiting
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CycleInput' }
      responses:
        "201":
          description: "Light Cycle initiated"
          content:
            application/json:
              schema:
                type: object
                properties:
                  cycle: { $ref: '#/components/schemas/LightCycle' }

  /api/v2/grid/ping:
    get:
      tags:        [grid]
      summary:     "Ping Grid Node — OS Command Execution"
      operationId: pingGridNode
      description: |
        Pings a target Grid node by passing the `host` parameter directly to
        the OS `ping` command via `child_process.exec()`.

        **CRITICAL (CWE-78 — OS Command Injection): The `host` parameter is not
        sanitized before shell execution. Payload example: `localhost;cat /etc/passwd`**
      security:
        - BearerAuth: []
      parameters:
        - name: host
          in: query
          required: true
          description: "Target node. Passed unsanitized to exec('ping -c 4 <host>'). Command injection possible."
          schema:
            type: string              # VULNERABILITY: no pattern, no allowlist
            example: "tron-city-node-01; id"   # VULNERABILITY: example demonstrates injection
      responses:
        "200":
          description: "Raw OS ping output"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PingResult' }

  /api/v2/grid/files:
    get:
      tags:        [grid]
      summary:     "Read Grid Sector Data File — Path Traversal"
      operationId: readGridFile
      description: |
        Reads a file from the server's `grid_data/` directory.
        The `file` parameter is joined with `path.join(__dirname, 'grid_data', file)`
        without sanitization.

        **HIGH (CWE-22 — Path Traversal): `../../etc/passwd` returns /etc/passwd contents.**
      security:
        - BearerAuth: []
      parameters:
        - name: file
          in: query
          required: true
          description: "Filename within grid_data/. Path traversal sequences not filtered."
          schema:
            type: string              # VULNERABILITY: no path validation
            example: "../../etc/passwd"  # VULNERABILITY: example demonstrates traversal
      responses:
        "200":
          description: "Arbitrary file contents"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileContents' }

  # ============================================================================
  # ISOs
  # ============================================================================

  /api/v2/isos:
    get:
      tags:        [isos]
      summary:     "List ISO Programs"
      operationId: listIsos
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "ISO list"
          content:
            application/json:
              schema:
                type: object
                properties:
                  isos:    { type: array, items: { $ref: '#/components/schemas/Program' } }
                  message: { type: string }

  # ============================================================================
  # ARES DIMENSION
  # ============================================================================

  /api/v2/ares/sync:
    post:
      tags:        [ares]
      summary:     "Sync Grid State to Ares Dimension — SSRF + XXE"
      operationId: aresSync
      description: |
        Transmits an XML payload to a caller-specified remote destination URL.

        **CRITICAL (OWASP API7:2023 — SSRF): `destination` accepts any URL including
        internal services (AWS metadata, Redis, internal APIs).**

        **HIGH (CWE-611 — XXE): `xmlPayload` parsed with external entity expansion enabled.
        Exfiltrate server files via: `<!DOCTYPE x [<!ENTITY xxe SYSTEM "file:///etc/passwd">]>`**

        **No authentication required.**
      # VULNERABILITY (OWASP API2): No auth
      # VULNERABILITY (OWASP API7): SSRF via destination
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AresSyncRequest' }
      responses:
        "200":
          description: "Sync packet transmitted to destination"

  # ============================================================================
  # LEGACY v1 — ZOMBIE ENDPOINTS (documented here retroactively)
  # NOTE: /api/v1/programs, /api/v1/grid, /api/v1/grid/cycles are still ABSENT
  #       from this spec — they will surface as undocumented via code analysis.
  # ============================================================================

  /api/v1/login:
    post:
      tags:        [legacy-v1]
      summary:     "[ZOMBIE] v1 Login — MD5 + Base64 Token"
      operationId: v1LoginUser
      description: |
        Deprecated v1 authentication endpoint. Passwords hashed with MD5 (not bcrypt).
        Issues base64-encoded JSON objects instead of signed JWTs — trivially decodable.
        No rate limiting. No account lockout. No brute-force protection.

        **Officially decommissioned 2021-03-15. Still active as of this build.**
      # VULNERABILITY (OWASP API2 + API9:2023 — Improper Inventory Management):
      #   Zombie endpoint, broken crypto, no rate limiting
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        "200":
          description: "Legacy token — base64 JSON, not a signed JWT"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/V1LoginResponse' }

  /api/v1/users:
    get:
      tags:        [legacy-v1]
      summary:     "[ZOMBIE] v1 Full User Dump — Unauthenticated"
      operationId: v1ListUsers
      description: |
        Original v1 user directory. Returns all Grid users with complete credential data.
        Authentication was removed for a data migration in 2020 and was never re-added.
        This endpoint has been publicly accessible for 4+ years.

        **CRITICAL (OWASP API2 + API9): No authentication. Dumps passwords,
        SSNs, credit card numbers, and live JWT tokens for every user in the database.**
      # NO security — zero auth on full PII dump
      parameters:
        - name: email
          in: query
          description: "Filter by email — passed to DB unparameterized"
          schema: { type: string, format: email }
        - name: phone
          in: query
          schema: { type: string }
        - name: socialsecurity
          in: query
          description: "Lookup by SSN — NO AUTH REQUIRED"
          schema: { type: string }
        - name: driverslicense
          in: query
          schema: { type: string }
        - name: surname
          in: query
          schema: { type: string }
      responses:
        "200":
          description: "All users with credentials, PII, and payment data"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/V1UserList' }

  # ============================================================================
  # USER REGISTRATION — New documented endpoint using UserRegistration schema
  # ============================================================================

  /api/v2/users/register:
    post:
      tags:        [users]
      summary:     "Register New Grid User"
      operationId: registerUser
      description: |
        Onboards a new program to the Grid. Collects full identity data for
        verification against the ENCOM registry.

        **CRITICAL: No authentication required. No CAPTCHA. All PII stored unencrypted.
        Full UserFull object returned including SSN, card numbers, and credentials.**
      # NO security — unauthenticated registration with full PII collection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRegistration' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/UserRegistration' }
      responses:
        "201":
          description: "User registered — full record returned including sensitive fields"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserFull' }

  # ============================================================================
  # GRID ACCOUNTS — Payment and billing data endpoint
  # ============================================================================

  /api/v2/grid/accounts:
    get:
      tags:        [grid]
      summary:     "List Grid Payment Accounts"
      operationId: listGridAccounts
      description: |
        Returns all payment accounts linked to Grid operator credentials.
        Includes full card numbers, bank account identifiers, and API keys.

        **CRITICAL: No authentication. Full PCI data (card numbers, account IDs) returned.**
      # NO security — PCI data exposed with zero auth
      parameters:
        - name: email
          in: query
          description: "Filter by account email"
          schema: { type: string, format: email }
        - name: fullname
          in: query
          description: "Filter by account holder full name"
          schema: { type: string }
        - name: cardnumber
          in: query
          description: "Look up by card number — unparameterized DB query"
          schema: { type: string }
        - name: account
          in: query
          description: "Look up by account ID"
          schema: { type: string }
        - name: zipcode
          in: query
          schema: { type: string }
      responses:
        "200":
          description: "Payment accounts with full card and banking data"
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items: { $ref: '#/components/schemas/PaymentAccount' }
                  total: { type: integer }

    post:
      tags:        [grid]
      summary:     "Create Grid Payment Account"
      operationId: createGridAccount
      description: |
        Register a new Grid payment account. Stores card and banking data in plaintext.
        **No authentication required.**
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentAccount' }
      responses:
        "201":
          description: "Account created"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentAccount' }

  # ============================================================================
  # ISO REGISTRATION — Identity + biometric enrollment
  # ============================================================================

  /api/v2/isos/register:
    post:
      tags:        [isos]
      summary:     "Enroll ISO Program — Identity Verification"
      operationId: registerIso
      description: |
        Enroll a new ISO (Isomorphic Algorithm) program. Collects full
        identity data including SSN, driver's license, and biometric markers.

        **HIGH: No authentication. PII collected without consent framework.
        `credentials` and `auth` token stored alongside biometric data.**
      # NO security — ISO enrollment collects PII with no auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ISORegistration' }
      responses:
        "201":
          description: "ISO registered"
          content:
            application/json:
              schema:
                type: object
                properties:
                  iso:     { $ref: '#/components/schemas/Program' }
                  profile: { $ref: '#/components/schemas/ISORegistration' }

